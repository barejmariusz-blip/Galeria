<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Galeria</title>
<style>
  :root { --bg:#f6f3ef; --card:#fff; --ink:#2b2622; --mute:#8b8178; --acc:#c2563f; --line:#e7e0d8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(246,243,239,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:12px 16px calc(10px) 16px; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; max-width:1400px; margin:0 auto; }
  h1 { font-size:20px; margin:0; font-weight:600; letter-spacing:.2px; flex:1 1 auto; }
  .sub { color:var(--mute); font-size:13px; }
  .count { font-weight:600; white-space:nowrap; }
  .count.over { color:var(--acc); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:8px 14px; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .tabs { display:flex; gap:6px; }
  main { max-width:1400px; margin:0 auto; padding:12px; }
  .note { max-width:1400px; margin:10px auto 0; padding:0 4px; color:var(--mute); font-size:14px; white-space:pre-line; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; }
  @media (min-width:700px) { .grid { grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; } }
  .cell { position:relative; aspect-ratio:1/1; background:#e9e3dc; border-radius:6px; overflow:hidden; cursor:zoom-in; }
  .cell canvas { width:100%; height:100%; display:block; opacity:0; transition:opacity .25s; pointer-events:none; }
  .cell canvas.ok { opacity:1; }
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  textarea { -webkit-user-select:text; user-select:text; }
  .cell .no { position:absolute; left:6px; bottom:6px; font-size:11px; color:#fff; text-shadow:0 1px 2px #0008; }
  .heart { position:absolute; right:6px; top:6px; width:40px; height:40px; border-radius:50%; border:0; padding:0;
    background:rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; }
  .heart.on { background:var(--acc); color:#fff; }
  .cell.sel { outline:3px solid var(--acc); outline-offset:-3px; }
  .empty, .err { text-align:center; color:var(--mute); padding:60px 20px; }
  /* podgląd */
  #lb { position:fixed; inset:0; background:#111; z-index:20; display:none; flex-direction:column; }
  #lb.open { display:flex; }
  #lb .bar { display:flex; align-items:center; gap:10px; padding:10px 12px; color:#ddd; }
  #lb .bar .t { flex:1; font-size:14px; }
  #lb .stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:pan-y; }
  #lb canvas { max-width:100%; max-height:100%; pointer-events:none; }
  #lb .shield { position:absolute; inset:0; }
  #lb .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); color:#fff;
    border:0; width:48px; height:64px; font-size:28px; border-radius:8px; }
  #lb .prev { left:8px; } #lb .next { right:8px; }
  #lb .bottom { display:flex; justify-content:center; padding:12px 12px calc(14px + env(safe-area-inset-bottom)); }
  #lb .bigheart { font-size:18px; padding:12px 26px; }
  #lb .x { background:transparent; color:#ddd; border-color:#444; }
  @media (max-width:600px) { #lb .nav { display:none; } }
  /* wysyłka */
  #send { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none; align-items:flex-end; justify-content:center; }
  #send.open { display:flex; }
  #send .box { background:var(--card); width:100%; max-width:560px; border-radius:16px 16px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width:600px) { #send { align-items:center; } #send .box { border-radius:16px; } }
  #send textarea { width:100%; min-height:70px; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
  #send .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  #send h2 { margin:0 0 6px; font-size:18px; }
  .lock { max-width:420px; margin:80px auto; text-align:center; color:var(--mute); }
  footer { text-align:center; color:var(--mute); font-size:12px; padding:30px 10px 40px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2b2622; color:#fff; padding:10px 16px;
    border-radius:999px; font-size:14px; z-index:40; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Galeria</h1>
    <span class="count" id="count"></span>
    <div class="tabs">
      <button id="tabAll" class="on">Wszystkie</button>
      <button id="tabSel">Wybrane</button>
    </div>
    <button class="primary" id="sendBtn">Wyślij wybór</button>
  </div>
</header>
<div class="note" id="note"></div>
<main><div class="grid" id="grid"></div><div id="msg"></div></main>
<footer id="foot"></footer>

<div id="lb">
  <div class="bar"><span class="t" id="lbT"></span><button class="x" id="lbX">✕ Zamknij</button></div>
  <div class="stage" id="stage">
    <canvas id="lbCv"></canvas><div class="shield" id="shield"></div>
    <button class="nav prev" id="lbPrev">‹</button>
    <button class="nav next" id="lbNext">›</button>
  </div>
  <div class="bottom"><button class="bigheart" id="lbHeart">♡ Wybieram</button></div>
</div>

<div id="send"><div class="box">
  <h2>Wysyłanie wyboru</h2>
  <div class="sub" id="sendInfo"></div>
  <p style="margin:12px 0 6px">Uwagi (opcjonalnie):</p>
  <textarea id="remarks" placeholder="np. to zdjęcie w czerni i bieli"></textarea>
  <div class="btns" id="sendBtns"></div>
  <div class="btns"><button id="sendClose">Wróć</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const gid = params.get("g");
  const keyStr = location.hash.slice(1);
  let key, M, sel = new Set(), view = [], showSel = false, cur = -1;
  const thumbs = new Map();   // indeks -> url
  let errCount = 0;
  const store = "fb-sel-" + gid;

  function b64u(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  }
  async function getDec(path, fresh) {
    // opis galerii zawsze świeży (żeby nie trzymać w pamięci starego błędu 404 sprzed publikacji)
    let r = await fetch(path, { cache: fresh ? "no-cache" : "default" });
    if (!r.ok) r = await fetch(path, { cache: "reload" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
  }
  // zdjęcia rysowane na <canvas> (nie <img>): brak „Zapisz obraz jako”, przeciągania i przytrzymania na telefonie
  async function bitmap(kind, i) {
    const data = await getDec(`g/${gid}/${kind}/${i}.bin`);
    return createImageBitmap(new Blob([data], { type: "image/jpeg" }));
  }
  function drawCover(cv, bm) {
    const s = Math.min(bm.width, bm.height), c = cv.getContext("2d");
    cv.width = cv.height = Math.min(420, s);
    c.drawImage(bm, (bm.width - s) / 2, (bm.height - s) / 2, s, s, 0, 0, cv.width, cv.height);
  }
  let lbBitmap = null;
  function drawLb() {
    const cv = $("lbCv"), st = $("stage"), bm = lbBitmap;
    if (!bm) return;
    const dpr = window.devicePixelRatio || 1;
    const sc = Math.min(st.clientWidth / bm.width, st.clientHeight / bm.height);
    const w = Math.max(1, Math.round(bm.width * sc)), h = Math.max(1, Math.round(bm.height * sc));
    cv.style.width = w + "px"; cv.style.height = h + "px";
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.getContext("2d").drawImage(bm, 0, 0, cv.width, cv.height);
  }
  window.addEventListener("resize", drawLb);
  document.addEventListener("contextmenu", (e) => { if (e.target.tagName !== "TEXTAREA") e.preventDefault(); });
  document.addEventListener("dragstart", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && ["s", "p", "u"].includes(e.key.toLowerCase())) e.preventDefault();
  });
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1800); }
  function fail(t) { document.querySelector("main").innerHTML = `<div class="lock">${t}</div>`; $("sendBtn").style.display = "none"; }

  function save() { try { localStorage.setItem(store, JSON.stringify([...sel])); } catch (e) {} }
  function load() { try { (JSON.parse(localStorage.getItem(store)) || []).forEach(i => sel.add(i)); } catch (e) {} }

  function updCount() {
    const n = sel.size, max = M.max || 0;
    $("count").textContent = max ? `Wybrano ${n} / ${max}` : `Wybrano ${n}`;
    $("count").classList.toggle("over", max && n > max);
    $("tabSel").textContent = `Wybrane (${n})`;
  }
  function toggle(i) {
    if (sel.has(i)) sel.delete(i); else {
      sel.add(i);
      if (M.max && sel.size > M.max) toast(`Pakiet obejmuje ${M.max} zdjęć – wybrano ${sel.size}`);
    }
    save(); updCount();
    const c = document.querySelector(`.cell[data-i="${i}"]`);
    if (c) { c.classList.toggle("sel", sel.has(i)); const h = c.querySelector(".heart"); h.classList.toggle("on", sel.has(i)); h.textContent = sel.has(i) ? "♥" : "♡"; }
    if (showSel && !sel.has(i) && cur < 0) render();
    updLbHeart();
  }

  const io = new IntersectionObserver((ents) => {
    for (const e of ents) if (e.isIntersecting) {
      io.unobserve(e.target); const i = +e.target.dataset.i, cv = e.target.querySelector("canvas");
      const set = (bm) => { drawCover(cv, bm); cv.classList.add("ok"); };
      if (thumbs.has(i)) set(thumbs.get(i));
      else bitmap("t", i).then(bm => { thumbs.set(i, bm); set(bm); }).catch((err) => {
        e.target.querySelector(".no").textContent = `${i + 1} – nie wczytano (${err.message || err})`;
        errCount++; if (errCount === 1) toast("Nie udało się wczytać części zdjęć – odśwież stronę za chwilę");
      });
    }
  }, { rootMargin: "600px" });

  function render() {
    const g = $("grid"); g.innerHTML = "";
    view = M.photos.map((_, i) => i).filter(i => !showSel || sel.has(i));
    $("msg").innerHTML = view.length ? "" : `<div class="empty">${showSel ? "Nie wybrano jeszcze żadnych zdjęć – kliknij ♡ przy zdjęciu." : "Brak zdjęć."}</div>`;
    for (const i of view) {
      const c = document.createElement("div"); c.className = "cell" + (sel.has(i) ? " sel" : ""); c.dataset.i = i;
      c.innerHTML = `<canvas></canvas><span class="no">${i + 1}</span><button class="heart${sel.has(i) ? " on" : ""}" aria-label="Wybierz">${sel.has(i) ? "♥" : "♡"}</button>`;
      c.querySelector(".heart").onclick = (ev) => { ev.stopPropagation(); toggle(i); };
      c.onclick = () => openLb(view.indexOf(i));
      g.appendChild(c); io.observe(c);
    }
  }

  // ---- podgląd
  let lbToken = 0;
  function updLbHeart() {
    if (cur < 0) return; const i = view[cur]; const on = sel.has(i);
    $("lbHeart").textContent = on ? "♥ Wybrane" : "♡ Wybieram"; $("lbHeart").classList.toggle("on", on);
  }
  async function openLb(k) {
    if (k < 0 || k >= view.length) return;
    cur = k; const i = view[k]; const t = ++lbToken;
    $("lb").classList.add("open"); document.body.style.overflow = "hidden";
    $("lbT").textContent = `${k + 1} / ${view.length}`;
    lbBitmap = thumbs.get(i) || null; drawLb();
    updLbHeart();
    try { const bm = await bitmap("p", i); if (t === lbToken) { if (lbBitmap && lbBitmap !== thumbs.get(i)) lbBitmap.close(); lbBitmap = bm; drawLb(); } } catch (e) {}
  }
  function closeLb() { $("lb").classList.remove("open"); document.body.style.overflow = ""; cur = -1; if (showSel) render(); }
  $("lbX").onclick = closeLb;
  $("lbPrev").onclick = () => openLb(cur - 1);
  $("lbNext").onclick = () => openLb(cur + 1);
  $("lbHeart").onclick = () => { if (cur >= 0) toggle(view[cur]); };
  document.addEventListener("keydown", (e) => {
    if (cur < 0) return;
    if (e.key === "ArrowLeft") openLb(cur - 1);
    else if (e.key === "ArrowRight") openLb(cur + 1);
    else if (e.key === "Escape") closeLb();
    else if (e.key === " ") { e.preventDefault(); toggle(view[cur]); }
  });
  let sx = null, sy = null;
  $("stage").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("stage").addEventListener("touchend", (e) => {
    if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) openLb(cur + (dx < 0 ? 1 : -1));
  });
  let lastTap = 0;
  $("stage").addEventListener("click", (e) => { if (e.target.id !== "shield") return; const n = Date.now(); if (n - lastTap < 300) toggle(view[cur]); lastTap = n; });

  // ---- zakładki
  $("tabAll").onclick = () => { showSel = false; $("tabAll").classList.add("on"); $("tabSel").classList.remove("on"); render(); };
  $("tabSel").onclick = () => { showSel = true; $("tabSel").classList.add("on"); $("tabAll").classList.remove("on"); render(); };

  // ---- wysyłka
  function message() {
    const names = [...sel].sort((a, b) => a - b).map(i => M.photos[i].n);
    let t = `Galeria „${M.title}” – wybrane zdjęcia (${names.length}):\n${names.join(", ")}`;
    const r = $("remarks").value.trim(); if (r) t += `\n\nUwagi: ${r}`;
    return t;
  }
  $("sendBtn").onclick = () => {
    const n = sel.size;
    if (!n) { toast("Najpierw wybierz zdjęcia (♡)"); return; }
    $("sendInfo").textContent = (M.max ? `Wybrano ${n} z ${M.max} zdjęć w pakiecie.` : `Wybrano ${n} zdjęć.`) + (M.max && n > M.max ? " To więcej niż w pakiecie." : "");
    const b = $("sendBtns"); b.innerHTML = "";
    const add = (label, fn, primary) => { const x = document.createElement("button"); x.textContent = label; if (primary) x.className = "primary"; x.onclick = fn; b.appendChild(x); };
    if (navigator.share) add("Udostępnij…", () => navigator.share({ text: message() }).catch(() => {}), true);
    if (M.phone) add("SMS", () => location.href = `sms:${M.phone}?&body=${encodeURIComponent(message())}`);
    if (M.phone) add("WhatsApp", () => window.open(`https://wa.me/${M.phone.replace(/\D/g, "")}?text=${encodeURIComponent(message())}`));
    if (M.email) add("E-mail", () => location.href = `mailto:${M.email}?subject=${encodeURIComponent("Wybór zdjęć – " + M.title)}&body=${encodeURIComponent(message())}`, !navigator.share);
    add("Kopiuj", async () => { try { await navigator.clipboard.writeText(message()); toast("Skopiowano – wklej w wiadomości"); } catch (e) { prompt("Skopiuj tekst:", message()); } });
    $("send").classList.add("open");
  };
  $("sendClose").onclick = () => $("send").classList.remove("open");
  $("send").onclick = (e) => { if (e.target.id === "send") $("send").classList.remove("open"); };

  // ---- start
  (async () => {
    if (!gid || !keyStr) return fail("To jest strona galerii zdjęć.<br>Aby zobaczyć swoje zdjęcia, otwórz <b>pełny link</b> otrzymany od fotografa.");
    if (!window.crypto || !crypto.subtle) return fail("Ta przeglądarka nie obsługuje galerii. Otwórz link w Chrome lub Safari.");
    try { key = await crypto.subtle.importKey("raw", b64u(keyStr), "AES-GCM", false, ["decrypt"]); }
    catch (e) { return fail("Nieprawidłowy link do galerii."); }
    try { M = JSON.parse(new TextDecoder().decode(await getDec(`g/${gid}/m.bin`, true))); }
    catch (e) { return fail(`Nie udało się otworzyć galerii (${e.message || e}).<br>Jeśli galeria została właśnie opublikowana, odczekaj 1–2 minuty i odśwież stronę.`); }
    document.title = M.title || "Galeria";
    $("title").textContent = M.title || "Galeria";
    $("note").textContent = (M.note ? M.note + "\n" : "") + `${M.photos.length} zdjęć`;
    $("foot").textContent = M.studio ? `© ${M.studio}` : "";
    load(); updCount(); render();
  })();
})();
</script>
</body>
</html>
